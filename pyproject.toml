[project]
name = "mcp-notes-server"
version = "1.0.0"
description = "MCP server over stdio: notes, full text search and tags, standard library only"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
mcp-notes = "mcp_notes.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mcp_notes"]
